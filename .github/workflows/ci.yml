name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check deepsc scripts tests
      - name: Unit tests
        run: pytest -q
      - name: Smoke test (1-epoch training on 256 sentences + evaluation)
        run: |
          python scripts/train.py --epochs 1 --max-train 256 --warmup-steps 10 --out /tmp/smoke.pt
          python scripts/evaluate.py --ckpt /tmp/smoke.pt --n-test 32 --snrs 0,12 --out /tmp/smoke.json
